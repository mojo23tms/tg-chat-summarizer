AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Telegram summarizer bot webhook deployment.

Globals:
  Function:
    Runtime: python3.12
    CodeUri: .
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        APP_SECRET_ID: !Ref AppSecretId
        DDB_TABLE_NAME: !Ref BotTable
        QUEUE_URL: !Ref UpdateQueue
        MESSAGE_TTL_DAYS: !Ref MessageTtlDays
        BOT_OWNER_IDS: !Ref BotOwnerIds
        MAX_INPUT_TOKENS: !Ref MaxInputTokens
        SUMMARY_OUTPUT_TOKENS: !Ref SummaryOutputTokens
        ASK_OUTPUT_TOKENS: !Ref AskOutputTokens
        MEMORY_OUTPUT_TOKENS: !Ref MemoryOutputTokens
        MEMORY_MAX_MESSAGES: !Ref MemoryMaxMessages
        SUMMARY_MAX_MESSAGES: !Ref SummaryMaxMessages
        LLM_REQUEST_TIMEOUT_SECONDS: !Ref LlmRequestTimeoutSeconds
        GEMINI_DAILY_TOKEN_QUOTA: !Ref GeminiDailyTokenQuota
        GROQ_DAILY_TOKEN_QUOTA: !Ref GroqDailyTokenQuota
        QUOTA_WARNING_REMAINING_PERCENT: !Ref QuotaWarningRemainingPercent
        LLM_BACKEND: gemini

Parameters:
  AppSecretId:
    Type: String
    Default: telegram-summarizer/prod
  MessageTtlDays:
    Type: Number
    Default: 365
  BotOwnerIds:
    Type: String
    Default: ""
  MaxInputTokens:
    Type: Number
    Default: 25000
  SummaryOutputTokens:
    Type: Number
    Default: 1500
  AskOutputTokens:
    Type: Number
    Default: 500
  MemoryOutputTokens:
    Type: Number
    Default: 1000
  MemoryMaxMessages:
    Type: Number
    Default: 500
  SummaryMaxMessages:
    Type: Number
    Default: 5000
  LlmRequestTimeoutSeconds:
    Type: Number
    Default: 45
  GeminiDailyTokenQuota:
    Type: Number
    Default: 0
  GroqDailyTokenQuota:
    Type: Number
    Default: 0
  QuotaWarningRemainingPercent:
    Type: Number
    Default: 10

Resources:
  TelegramApi:
    Type: AWS::Serverless::HttpApi

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: telegram_summarizer.aws_webhook.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt UpdateQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppSecretId}*"
      Events:
        TelegramWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref TelegramApi
            Path: /telegram
            Method: POST

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: telegram_summarizer.aws_worker.lambda_handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotTable
        - SQSPollerPolicy:
            QueueName: !GetAtt UpdateQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppSecretId}*"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt UpdateQueue.Arn
            BatchSize: 1

  UpdateQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-updates.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 180

  BotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  WebhookUrl:
    Description: Telegram webhook endpoint.
    Value: !Sub "https://${TelegramApi}.execute-api.${AWS::Region}.amazonaws.com/telegram"
  TableName:
    Description: DynamoDB table name.
    Value: !Ref BotTable
  QueueUrl:
    Description: SQS FIFO queue URL.
    Value: !Ref UpdateQueue
