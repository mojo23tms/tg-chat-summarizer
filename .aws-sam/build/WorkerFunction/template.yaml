AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Telegram summarizer bot webhook deployment.

Globals:
  Function:
    Runtime: python3.12
    CodeUri: .
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TELEGRAM_TOKEN: !Ref TelegramToken
        GEMINI_API_KEY: !Ref GeminiApiKey
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
        DDB_TABLE_NAME: !Ref BotTable
        QUEUE_URL: !Ref UpdateQueue
        MESSAGE_TTL_DAYS: !Ref MessageTtlDays
        BOT_OWNER_IDS: !Ref BotOwnerIds
        MAX_INPUT_TOKENS: !Ref MaxInputTokens
        SUMMARY_OUTPUT_TOKENS: !Ref SummaryOutputTokens
        LLM_BACKEND: gemini

Parameters:
  TelegramToken:
    Type: String
    NoEcho: true
  GeminiApiKey:
    Type: String
    NoEcho: true
  TelegramWebhookSecret:
    Type: String
    NoEcho: true
  MessageTtlDays:
    Type: Number
    Default: 365
  BotOwnerIds:
    Type: String
    Default: ""
  MaxInputTokens:
    Type: Number
    Default: 25000
  SummaryOutputTokens:
    Type: Number
    Default: 1500

Resources:
  TelegramApi:
    Type: AWS::Serverless::HttpApi

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: telegram_summarizer.aws_webhook.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt UpdateQueue.QueueName
      Events:
        TelegramWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref TelegramApi
            Path: /telegram
            Method: POST

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: telegram_summarizer.aws_worker.lambda_handler
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotTable
        - SQSPollerPolicy:
            QueueName: !GetAtt UpdateQueue.QueueName
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt UpdateQueue.Arn
            BatchSize: 1

  UpdateQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-updates.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 180

  BotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  WebhookUrl:
    Description: Telegram webhook endpoint.
    Value: !Sub "https://${TelegramApi}.execute-api.${AWS::Region}.amazonaws.com/telegram"
  TableName:
    Description: DynamoDB table name.
    Value: !Ref BotTable
  QueueUrl:
    Description: SQS FIFO queue URL.
    Value: !Ref UpdateQueue
